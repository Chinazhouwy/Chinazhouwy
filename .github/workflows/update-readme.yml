name: Update profile README contributions

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC (11:17 Beijing)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PRs and update README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          user = "Chinazhouwy"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "readme-updater",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = "Bearer " + token

          url = ("https://api.github.com/search/issues?q=type:pr+author:" + user
                 + "+is:merged&per_page=100&sort=updated&order=desc")
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          rows = []
          for item in data.get("items", []):
              repo = item["repository_url"].rsplit("/repos/", 1)[-1]
              owner = repo.split("/")[0]
              if owner.lower() == user.lower():
                  continue
              title = item["title"].replace("|", "\\|").replace("\n", " ")
              number = item["number"]
              html = item["html_url"]
              rows.append(
                  "| [%s](https://github.com/%s) | [#%d %s](%s) | ✅ Merged |"
                  % (repo, repo, number, title, html)
              )

          table_lines = [
              "| Repository | Pull Request | Status |",
              "| --- | --- | --- |",
          ] + (rows or ["| _No merged PRs to other repositories yet_ | | |"])

          begin = "<!-- CONTRIBUTIONS:START -->"
          end = "<!-- CONTRIBUTIONS:END -->"
          section = begin + "\n" + "\n".join(table_lines) + "\n" + end

          with open("README.md") as f:
              content = f.read()

          if begin in content and end in content:
              pre = content.split(begin)[0]
              post = content.split(end, 1)[1]
              new_content = pre + section + post
          else:
              anchor = "## 📊 GitHub Stats"
              block = ("## 🚀 Open Source Contributions\n\n"
                       "Merged pull requests to community repositories:\n\n"
                       + section + "\n\n")
              if anchor in content:
                  new_content = content.replace(anchor, block + anchor, 1)
              else:
                  new_content = content.rstrip() + "\n\n" + block

          if new_content != content:
              with open("README.md", "w") as f:
                  f.write(new_content)
              print("README updated")
          else:
              print("No changes")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Auto-update merged PR contributions" && git push)
